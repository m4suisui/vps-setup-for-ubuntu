name: SSH key regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n init-user.sh vps-hardening.sh verify.sh lib/ssh-keys.sh
      - name: Test with real OpenSSH keys
        run: python3 -m unittest discover -s tests -v
